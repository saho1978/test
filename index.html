<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>귀여운 펭귄 시각 타이머</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    
    <!-- ======================================================================= -->
    <!--                                CSS 영역                                 -->
    <!-- ======================================================================= -->
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #E0F7FA; /* 하늘색 배경 */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1), 0 inset 0 0 0 4px white;
        }

        /* 디지털 시계 입력 필드 스타일 */
        .digital-input {
            background-color: #333;
            color: #00FF41; /* 형광 초록빛 */
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            text-align: center;
            border: 4px solid #555;
            border-radius: 12px;
            width: 80px;
            height: 70px;
            font-size: 3rem;
            outline: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.3s;
        }

        .digital-input:focus {
            border-color: #FBC02D;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8), 0 0 15px rgba(251, 192, 45, 0.6);
        }

        /* 스피너 제거 */
        .digital-input::-webkit-outer-spin-button,
        .digital-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .digital-input[type=number] {
            -moz-appearance: textfield;
        }

        /* 시계 바늘 애니메이션 효과 (실제 시계처럼 약간 튕기는 느낌) */
        .hand {
            transition: transform 0.2s cubic-bezier(0.4, 2.08, 0.55, 0.44);
        }
        
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .timeup-anim {
            animation: shake 0.5s infinite;
        }

        /* 귀여운 버튼 호버 효과 */
        .cute-btn {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .cute-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }
        .cute-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        /* 알림 메시지 */
        #alert-box {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 235, 59, 0.95);
            padding: 30px;
            border-radius: 20px;
            border: 4px solid #F57F17;
            text-align: center;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: bounce 0.5s ease;
        }
    </style>
    <!-- ======================================================================= -->
    <!--                              CSS 영역 끝                                -->
    <!-- ======================================================================= -->

</head>

<!-- ======================================================================= -->
<!--                               HTML 구조 영역                              -->
<!-- ======================================================================= -->
<body>

<div class="glass-panel w-full max-w-md p-6 flex flex-col items-center relative shadow-2xl mx-4">
    
    <h1 class="text-3xl text-blue-600 mb-4 font-bold tracking-wide drop-shadow-md">
        ⏱️ 아날로그 시각 타이머
    </h1>

    <!-- 1. 맨 위 전자시계 형식 세팅부 -->
    <div class="bg-gray-800 p-4 rounded-2xl mb-4 w-full flex flex-col items-center border-4 border-gray-700 shadow-inner">
        <div class="text-gray-400 text-sm mb-2">시간을 클릭해서 수정하거나 버튼을 누르세요</div>
        <div class="flex items-center justify-center space-x-2">
            <input type="number" id="input-min" class="digital-input" value="00" min="0" max="99" onchange="formatInput(this)">
            <span class="text-4xl text-white font-bold pb-2 animate-pulse">:</span>
            <input type="number" id="input-sec" class="digital-input" value="00" min="0" max="59" onchange="formatInput(this)">
        </div>
        
        <!-- 빠른 시간 추가 버튼 -->
        <div class="flex space-x-2 mt-4">
            <button onclick="addTime(10)" class="bg-blue-500 hover:bg-blue-400 text-white px-3 py-1 rounded-full text-sm font-bold shadow transition cute-btn">+10초</button>
            <button onclick="addTime(60)" class="bg-green-500 hover:bg-green-400 text-white px-3 py-1 rounded-full text-sm font-bold shadow transition cute-btn">+1분</button>
            <button onclick="addTime(300)" class="bg-orange-500 hover:bg-orange-400 text-white px-3 py-1 rounded-full text-sm font-bold shadow transition cute-btn">+5분</button>
            <button onclick="clearTime()" class="bg-red-500 hover:bg-red-400 text-white px-3 py-1 rounded-full text-sm font-bold shadow transition cute-btn">초기화</button>
        </div>
    </div>

    <!-- 2. 중앙 시각화 애니메이션 영역 -->
    <div class="relative w-72 h-72 flex justify-center items-center mb-6">
        <!-- 아날로그 시계 (SVG) -->
        <svg id="analog-clock" class="w-full h-full drop-shadow-xl" viewBox="0 0 300 300">
            <!-- 시계 배경 -->
            <circle cx="150" cy="150" r="140" fill="#ffffff" stroke="#cbd5e1" stroke-width="8" />
            
            <!-- 눈금 (JS에서 동적으로 생성) -->
            <g id="clock-ticks"></g>
            
            <!-- 주요 숫자 -->
            <text x="150" y="48" text-anchor="middle" font-size="22" font-weight="900" fill="#475569">60</text>
            <text x="260" y="158" text-anchor="middle" font-size="22" font-weight="900" fill="#475569">15</text>
            <text x="150" y="272" text-anchor="middle" font-size="22" font-weight="900" fill="#475569">30</text>
            <text x="40" y="158" text-anchor="middle" font-size="22" font-weight="900" fill="#475569">45</text>

            <!-- 분침 -->
            <g id="minute-hand" class="hand" transform="rotate(0, 150, 150)">
                <line x1="150" y1="150" x2="150" y2="55" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
            </g>
            
            <!-- 초침 -->
            <g id="second-hand" class="hand" transform="rotate(0, 150, 150)">
                <line x1="150" y1="165" x2="150" y2="35" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
                <circle cx="150" cy="150" r="6" fill="#ef4444" />
                <circle cx="150" cy="150" r="2" fill="#ffffff" />
            </g>
        </svg>
    </div>

    <!-- 3. 컨트롤러 버튼 -->
    <div class="flex space-x-4 w-full">
        <button id="btn-start" onclick="toggleTimer()" class="flex-1 bg-yellow-400 hover:bg-yellow-300 text-yellow-900 text-xl py-4 rounded-2xl font-bold shadow-[0_4px_0_#F57F17] active:shadow-[0_0px_0_#F57F17] active:translate-y-1 transition cute-btn border-2 border-yellow-500">
            시작하기!
        </button>
    </div>
</div>

<!-- 시간 종료 알림창 -->
<div id="alert-box">
    <h2 class="text-4xl text-orange-600 mb-2">삐빅! ⏰</h2>
    <p class="text-2xl text-gray-800 mb-4">약속한 시간이 다 되었어요!</p>
    <button onclick="closeAlert()" class="bg-orange-500 text-white px-8 py-3 rounded-xl text-xl font-bold hover:bg-orange-400 cute-btn shadow-md">
        확인
    </button>
</div>

<!-- 축하 꽃가루 캔버스 -->
<canvas id="confetti-canvas" class="absolute top-0 left-0 w-full h-full pointer-events-none" style="display: none;"></canvas>

<!-- ======================================================================= -->
<!--                            HTML 구조 영역 끝                              -->
<!-- ======================================================================= -->


<!-- ======================================================================= -->
<!--                             JAVASCRIPT 영역                               -->
<!-- ======================================================================= -->
<script>
    // --- 타이머 상태 변수 ---
    let totalSeconds = 0;
    let remainingSeconds = 0;
    let timerInterval = null;
    let isRunning = false;

    // --- DOM 요소 ---
    const inputMin = document.getElementById('input-min');
    const inputSec = document.getElementById('input-sec');
    const btnStart = document.getElementById('btn-start');
    const analogClock = document.getElementById('analog-clock');
    const minuteHand = document.getElementById('minute-hand');
    const secondHand = document.getElementById('second-hand');
    const alertBox = document.getElementById('alert-box');
    const confettiCanvas = document.getElementById('confetti-canvas');
    
    // --- 아날로그 시계 눈금 그리기 ---
    function initClock() {
        const clockTicks = document.getElementById('clock-ticks');
        for (let i = 0; i < 60; i++) {
            const angle = i * 6; // 360도 / 60 = 6도
            const isHour = i % 5 === 0;
            const length = isHour ? 12 : 5;
            const strokeWidth = isHour ? 3 : 1.5;
            const color = isHour ? '#64748b' : '#cbd5e1';
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', '150');
            line.setAttribute('y1', '18'); // 바깥쪽 여백
            line.setAttribute('x2', '150');
            line.setAttribute('y2', (18 + length).toString());
            line.setAttribute('stroke', color);
            line.setAttribute('stroke-width', strokeWidth);
            line.setAttribute('transform', `rotate(${angle}, 150, 150)`);
            clockTicks.appendChild(line);
        }
    }
    initClock();

    // --- 웹 오디오 API (경고음용) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playBeep() {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 note
        oscillator.frequency.exponentialRampToValueAtTime(1760, audioCtx.currentTime + 0.1);
        
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
        
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.5);
    }

    // --- 함수들 ---

    // 입력값 포맷팅 (한자리수면 앞에 0 붙이기)
    function formatInput(el) {
        let val = parseInt(el.value);
        if (isNaN(val) || val < 0) val = 0;
        
        if (el.id === 'input-sec' && val > 59) val = 59; // 초는 59초까지만
        if (el.id === 'input-min' && val > 99) val = 99; // 분은 99분까지만

        el.value = val < 10 ? '0' + val : val;
        
        // 정지 상태일때만 총 시간 업데이트
        if(!isRunning) {
            updateTotalSecondsFromInput();
            updateVisuals();
        }
    }

    // 입력창 -> 총 초 계산
    function updateTotalSecondsFromInput() {
        const m = parseInt(inputMin.value) || 0;
        const s = parseInt(inputSec.value) || 0;
        totalSeconds = (m * 60) + s;
        remainingSeconds = totalSeconds;
    }

    // 초 -> 입력창 업데이트
    function updateInputsFromSeconds(secs) {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        inputMin.value = m < 10 ? '0' + m : m;
        inputSec.value = s < 10 ? '0' + s : s;
    }

    // 빠른 시간 추가 버튼
    function addTime(secondsToAdd) {
        if(isRunning) return; // 실행중일 땐 시간 추가 막음
        updateTotalSecondsFromInput();
        totalSeconds += secondsToAdd;
        
        if(totalSeconds > 5999) totalSeconds = 5999; // 최대 99분 59초
        
        remainingSeconds = totalSeconds;
        updateInputsFromSeconds(totalSeconds);
        updateVisuals();
    }

    // 시간 초기화
    function clearTime() {
        if(isRunning) toggleTimer(); // 실행중이면 정지
        inputMin.value = '00';
        inputSec.value = '00';
        updateTotalSecondsFromInput();
        updateVisuals();
        analogClock.classList.remove('timeup-anim'); // 애니메이션 초기화
    }

    // 타이머 시작/정지 토글
    function toggleTimer() {
        if (isRunning) {
            // 정지
            clearInterval(timerInterval);
            isRunning = false;
            btnStart.textContent = "계속하기!";
            btnStart.classList.replace('bg-red-400', 'bg-yellow-400');
            btnStart.classList.replace('hover:bg-red-300', 'hover:bg-yellow-300');
            btnStart.classList.replace('text-red-900', 'text-yellow-900');
            btnStart.classList.replace('border-red-500', 'border-yellow-500');
            btnStart.classList.replace('shadow-[0_4px_0_#C62828]', 'shadow-[0_4px_0_#F57F17]');
            analogClock.classList.remove('timeup-anim');
            
            // 입력창 활성화
            inputMin.disabled = false;
            inputSec.disabled = false;
        } else {
            // 시작
            updateTotalSecondsFromInput();
            if (totalSeconds <= 0) return; // 시간이 0이면 시작 안함

            isRunning = true;
            inputMin.disabled = true; // 실행중엔 수정 불가
            inputSec.disabled = true;
            
            btnStart.textContent = "일시정지";
            btnStart.classList.replace('bg-yellow-400', 'bg-red-400');
            btnStart.classList.replace('hover:bg-yellow-300', 'hover:bg-red-300');
            btnStart.classList.replace('text-yellow-900', 'text-red-900');
            btnStart.classList.replace('border-yellow-500', 'border-red-500');
            btnStart.classList.replace('shadow-[0_4px_0_#F57F17]', 'shadow-[0_4px_0_#C62828]');
            
            analogClock.classList.remove('timeup-anim');
            
            timerInterval = setInterval(tick, 1000);
        }
    }

    // 1초마다 실행되는 틱
    function tick() {
        remainingSeconds--;
        updateInputsFromSeconds(remainingSeconds);
        updateVisuals();

        if (remainingSeconds <= 0) {
            timerEnded();
        }
    }

    // 시각적 요소(시계 바늘) 업데이트
    function updateVisuals() {
        // 남은 시간에 따른 분침과 초침의 각도 계산 (1바퀴 360도)
        const seconds = remainingSeconds % 60;
        // 분침이 1분 동안 딱딱 끊어지지 않고 초에 비례해 부드럽게 이동하게 계산
        const minutes = Math.floor(remainingSeconds / 60) + (seconds / 60);

        const secAngle = seconds * 6; // 1초당 6도
        const minAngle = minutes * 6; // 1분당 6도

        secondHand.setAttribute('transform', `rotate(${secAngle}, 150, 150)`);
        minuteHand.setAttribute('transform', `rotate(${minAngle}, 150, 150)`);
    }

    // 타이머 종료 처리
    function timerEnded() {
        clearInterval(timerInterval);
        isRunning = false;
        
        // UI 초기화
        btnStart.textContent = "시작하기!";
        btnStart.classList.replace('bg-red-400', 'bg-yellow-400');
        btnStart.classList.replace('hover:bg-red-300', 'hover:bg-yellow-300');
        btnStart.classList.replace('text-red-900', 'text-yellow-900');
        btnStart.classList.replace('border-red-500', 'border-yellow-500');
        btnStart.classList.replace('shadow-[0_4px_0_#C62828]', 'shadow-[0_4px_0_#F57F17]');
        
        inputMin.disabled = false;
        inputSec.disabled = false;

        // 애니메이션 및 효과음 (시계 흔들림)
        analogClock.classList.add('timeup-anim');
        
        playBeep();
        setTimeout(playBeep, 400);
        setTimeout(playBeep, 800);
        
        showAlert();
    }

    // 알림창 표시
    function showAlert() {
        alertBox.style.display = 'block';
        confettiCanvas.style.display = 'block';
        drawConfetti();
    }

    // 알림창 닫기
    function closeAlert() {
        alertBox.style.display = 'none';
        confettiCanvas.style.display = 'none';
        analogClock.classList.remove('timeup-anim');
    }

    // --- 간단한 축하 꽃가루(Confetti) 효과 ---
    const ctx = confettiCanvas.getContext('2d');
    let particles = [];
    
    function drawConfetti() {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
        particles = [];
        for(let i=0; i<100; i++){
            particles.push({
                x: Math.random() * confettiCanvas.width,
                y: Math.random() * confettiCanvas.height - confettiCanvas.height,
                w: Math.random() * 10 + 5,
                h: Math.random() * 10 + 5,
                c: `hsl(${Math.random() * 360}, 100%, 50%)`,
                s: Math.random() * 5 + 2
            });
        }
        animateConfetti();
    }

    function animateConfetti() {
        if(alertBox.style.display === 'none') return;
        ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        
        particles.forEach(p => {
            ctx.fillStyle = p.c;
            ctx.fillRect(p.x, p.y, p.w, p.h);
            p.y += p.s;
            p.x += Math.sin(p.y / 20); // 좌우 흔들림
            if(p.y > confettiCanvas.height) p.y = -10;
        });
        
        requestAnimationFrame(animateConfetti);
    }

</script>
<!-- ======================================================================= -->
<!--                           JAVASCRIPT 영역 끝                              -->
<!-- ======================================================================= -->

</body>
</html>
